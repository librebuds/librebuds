name: Build debug APK

# Run it from the GitHub app or website: Actions -> Build debug APK -> Run workflow.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The runner already ships the Android SDK. Accept its licences so Gradle can download
      # any missing platform (SDK 37) on its own.
      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Test additional earbud model recognition
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --tests io.github.librebuds.ui.other.OtherEarbudsCatalogTest --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: librebuds-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
